name: CI

on:
  push:
    branches:
      - '**' # 仅分支推送触发；tag 推送由 release.yml 负责验证与发布
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build binary
        run: cargo build --locked

  windows-check:
    name: Compile & test (Windows MSVC)
    # 与 release.yml 发版 target 一致，捕获仅在 cfg(windows) 下可见的编译/Clippy 问题
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
