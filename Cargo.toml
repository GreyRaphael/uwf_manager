[package]
name = "uwf_manager"
version = "0.4.3"
edition = "2024"
rust-version = "1.99"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "clipboard",
    "default_fonts",
    "system_fonts",
    "x11",
    "wayland",
] }
egui_extras = { version = "0.37.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["ico"] }
rfd = "0.18.0"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe"] }

[target.'cfg(windows)'.dependencies]
wmi = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
